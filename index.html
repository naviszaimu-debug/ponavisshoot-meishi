<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>名刺登録 - PoNavisShoot別館</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; background: #f2f4f7; color: #1f2937; padding-bottom: 40px; }
  header { position: sticky; top: 0; z-index: 5; background: #0f4c81; color: #fff; padding: 10px 16px; }
  header .hrow { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  header .who { font-size: 18px; font-weight: bold; }
  #btn-send { padding: 8px 12px; font-size: 14px; font-weight: bold; border-radius: 8px; border: none; background: #fff; color: #0f4c81; white-space: nowrap; }
  #btn-send:disabled { opacity: .5; }
  .menu-badge { display: none; margin-left: 4px; }
  .menu-badge.show { display: inline; }
  #send-status { font-size: 12px; min-height: 16px; margin-top: 2px; }
  .badge.unsent { background: #fecaca; color: #991b1b; }
  .subline { font-size: 12px; color: #6b7280; margin-top: 2px; }
  .hint { font-size: 12px; color: #6b7280; margin-top: 6px; }
  header .sub { font-size: 12px; opacity: .85; }
  .tabs { display: flex; background: #fff; border-bottom: 1px solid #d1d5db; position: sticky; top: 58px; z-index: 4; }
  .tab { flex: 1; padding: 12px 0; text-align: center; font-size: 15px; background: none; border: none; border-bottom: 3px solid transparent; color: #6b7280; }
  .tab.active { color: #0f4c81; border-bottom-color: #0f4c81; font-weight: bold; }
  .view { display: none; padding: 14px 16px; max-width: 640px; margin: 0 auto; }
  .view.active { display: block; }
  .slots { display: flex; flex-direction: column; gap: 12px; }
  .slot-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .slot-head .slot-label { margin-bottom: 0; }
  .rot { display: flex; gap: 6px; }
  .rot button { padding: 4px 12px; font-size: 14px; border-radius: 6px; border: 1px solid #0f4c81; background: #fff; color: #0f4c81; }
  .slot { flex: 1; }
  .slot-label { font-size: 13px; color: #4b5563; margin-bottom: 4px; }
  .slot-box { position: relative; aspect-ratio: 91 / 55; background: #fff; border: 2px dashed #9ca3af; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; color: #6b7280; font-size: 14px; }
  .slot-box img { width: 100%; height: 100%; object-fit: contain; display: none; }
  .slot-box.filled { border-style: solid; border-color: #0f4c81; }
  .slot-box.filled img { display: block; }
  .slot-box.filled .slot-hint { display: none; }
  .slot-box.disabled { opacity: .35; }
  .slot input[type=file] { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .slot-box.disabled input[type=file] { pointer-events: none; }
  .row { margin-top: 10px; }
  label.check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .field-label { font-size: 13px; color: #4b5563; margin: 14px 0 4px; }
  .field-label small { color: #9ca3af; }
  .field-label small.req { color: #b91c1c; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 8px 14px; border-radius: 20px; border: 1px solid #9ca3af; background: #fff; font-size: 14px; color: #374151; }
  .chip.on { background: #0f4c81; border-color: #0f4c81; color: #fff; }
  input[type=text], input[type=date], textarea { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #9ca3af; border-radius: 8px; background: #fff; font-family: inherit; }
  textarea { min-height: 90px; resize: vertical; }
  .inline { display: flex; gap: 8px; }
  .inline input { flex: 1; }
  button.btn { padding: 10px 14px; font-size: 14px; border-radius: 8px; border: 1px solid #0f4c81; background: #fff; color: #0f4c81; }
  button.primary { width: 100%; margin-top: 18px; padding: 14px; font-size: 17px; font-weight: bold; border: none; background: #0f4c81; color: #fff; border-radius: 10px; }
  button:disabled { opacity: .4; }
  .status { margin-top: 10px; min-height: 20px; font-size: 14px; }
  .status.ok { color: #15803d; } .status.err { color: #b91c1c; } .status.busy { color: #6b7280; }
  .filters { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .card { display: flex; gap: 12px; background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 10px; border: 1px solid #e5e7eb; }
  .card .cbody { flex: 1; min-width: 0; }
  .card .top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: #6b7280; }
  .card .main { font-size: 17px; font-weight: bold; margin-top: 4px; line-height: 1.35; word-break: break-all; }
  .card .main .badge { font-weight: normal; vertical-align: middle; }
  .thumbbox { flex: none; width: 112px; aspect-ratio: 3 / 2; align-self: flex-start; margin-top: 2px; background: #eef0f3; border-radius: 6px; overflow: hidden; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #9ca3af; }
  .thumb { width: 100%; height: 100%; object-fit: contain; display: none; }
  .thumb.on { display: block; }
  .thumbbox.has .ph { display: none; }
  .sortbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 13px; color: #4b5563; }
  .sortbar select { padding: 8px; font-size: 14px; border: 1px solid #9ca3af; border-radius: 8px; background: #fff; }
  .section-title { font-size: 14px; font-weight: bold; color: #0f4c81; margin: 22px 0 4px; padding-bottom: 4px; border-bottom: 2px solid #0f4c81; }
  .exrow { display: grid; grid-template-columns: 84px 1fr 56px; align-items: center; gap: 6px; margin-top: 6px; }
  .exrow label { font-size: 12px; color: #4b5563; }
  .exrow input, .exrow textarea { padding: 8px; font-size: 15px; min-height: 0; }
  .exrow textarea { grid-column: 2 / 3; min-height: 54px; }
  .act { text-align: center; font-size: 12px; padding: 7px 0; border-radius: 6px; border: 1px solid #0f4c81; color: #0f4c81; background: #fff; text-decoration: none; }
  .act.disabled { opacity: .35; pointer-events: none; }
  .badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #fde68a; color: #92400e; margin-left: 6px; }
  .empty { color: #9ca3af; text-align: center; padding: 24px 0; }
  .detail-imgs { display: flex; gap: 8px; }
  .detail-imgs div { flex: 1; background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; min-height: 80px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #9ca3af; overflow: hidden; }
  .detail-imgs img { width: 100%; display: block; }
  .meta { font-size: 12px; color: #6b7280; margin: 8px 0; line-height: 1.6; }
  .gate { padding: 40px 16px; text-align: center; color: #b91c1c; }
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div>
      <div class="who" id="who">読み込み中…</div>
      <div class="sub">名刺登録(PoNavisShoot別館)</div>
    </div>
    <!-- 未送信が無くてもボタンは常時表示(押せない状態)。未送信がある間は⚠️を出し続ける(PNSと同じ方式) -->
    <button id="btn-send" type="button" disabled>まとめて送信<span id="send-count"></span><span id="send-badge" class="menu-badge">⚠️</span></button>
  </div>
  <div id="send-status"></div>
</header>

<div class="tabs">
  <button class="tab active" data-view="shoot">撮影</button>
  <button class="tab" data-view="list">一覧・メモ追記</button>
</div>

<!-- 撮影 -->
<section class="view active" id="view-shoot">
  <div class="slots">
    <div class="slot">
      <div class="slot-head"><div class="slot-label">① 表(名刺を横向きに)</div><div class="rot"><button type="button" id="rot-l-front" disabled>↺ 左回転</button><button type="button" id="rot-r-front" disabled>↻ 右回転</button></div></div>
      <div class="slot-box" id="box-front"><span class="slot-hint">タップして撮影</span><img id="img-front" alt=""><input type="file" accept="image/*" capture="environment" id="in-front"></div>
    </div>
    <div class="slot">
      <div class="slot-head"><div class="slot-label">② 裏</div><div class="rot"><button type="button" id="rot-l-back" disabled>↺ 左回転</button><button type="button" id="rot-r-back" disabled>↻ 右回転</button></div></div>
      <div class="slot-box" id="box-back"><span class="slot-hint">タップして撮影</span><img id="img-back" alt=""><input type="file" accept="image/*" capture="environment" id="in-back"></div>
    </div>
  </div>
  <div class="row"><label class="check"><input type="checkbox" id="no-back"> 裏面なし(白紙・印字なし)</label></div>

  <div class="field-label">受領日 <small class="req">(必須・初期値は今日)</small></div>
  <input type="date" id="received">

  <div class="field-label">区分 <small>(任意)</small></div>
  <div class="chips" id="category-chips"></div>

  <div class="field-label">目的 <small>(任意)</small></div>
  <div class="chips" id="purpose-chips"></div>

  <div class="field-label">場所 <small>(任意)</small></div>
  <div class="inline"><input type="text" id="place" placeholder="例: 和歌山商工会議所 展示会場"><button class="btn" id="btn-geo" type="button">現在地</button></div>

  <div class="field-label">メモ <small>(任意。後からでも書けます)</small></div>
  <textarea id="note" placeholder="例: ○○の件で紹介してもらった。来月訪問予定"></textarea>

  <button class="primary" id="btn-save" disabled>保存する</button>
  <div class="hint">保存すると、いったんこの端末に入ります。上の「まとめて送信」を押すと、まとめて送られます。</div>
  <div class="status" id="shoot-status"></div>
</section>

<!-- 一覧 -->
<section class="view" id="view-list">
  <div id="list-pane">
    <div class="filters" id="filters"></div>
    <div class="sortbar"><span>並び替え</span><select id="sort-key"></select><button class="btn" id="sort-dir" type="button"></button></div>
    <div id="list"></div>
  </div>
  <div id="detail-pane" style="display:none">
    <button class="btn" id="btn-back" type="button">← 一覧へ戻る</button>
    <div class="row detail-imgs"><div id="d-front">表</div><div id="d-back">裏</div></div>
    <div class="meta" id="d-meta"></div>

    <div class="field-label">名称 <small>(会社名・氏名など。任意)</small></div>
    <input type="text" id="d-name" placeholder="例: 税理士法人RINGS 武田 亨">

    <div class="section-title">連絡先(名刺から読み取った内容)</div>
    <div id="d-ex-top"></div>

    <div class="section-title">この名刺の管理情報</div>
    <div class="field-label">受領日</div>
    <input type="date" id="d-received">
    <div class="field-label">区分</div>
    <div class="chips" id="d-category-chips"></div>
    <div class="field-label">目的</div>
    <div class="chips" id="d-purpose-chips"></div>
    <div class="field-label">場所</div>
    <div class="inline"><input type="text" id="d-place"><button class="btn" id="btn-d-geo" type="button">現在地</button></div>
    <div class="field-label">メモ</div>
    <textarea id="d-note"></textarea>

    <div class="section-title">その他の読み取り情報</div>
    <div id="d-ex-bottom"></div>

    <button class="primary" id="btn-d-save" disabled>保存</button>
    <div class="status" id="detail-status"></div>
  </div>
</section>

<script>
// ★デプロイ後のGASウェブアプリURLに書き換える(GAS側のデプロイ→ウェブアプリのURL)
const GAS_URL = "https://script.google.com/macros/s/AKfycbw2tt98PZcaFTtDWYDIpYw-2_zhODCJW5LCXo51xK1YqqwIqrqDU30Cn12v3oRAyREuqg/exec";

const PURPOSES = ['展示会', '訪問', '紹介', 'セミナー', 'その他'];
const CATEGORIES = ['顧問先', 'その他']; // 関係区分(GAS側のCATEGORIESと揃える)
const MAX_EDGE = 1800;
const JPEG_QUALITY = 0.85;
const TOKEN = new URLSearchParams(location.search).get('token');

const $ = (id) => document.getElementById(id);
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
let staffName = '';
let pendingItems = []; // 端末内にある未送信の名刺(この専用URLの担当者分のみ)
let batchSending = false;
let cards = [];
let filterMode = 'all';
let shoot = { front: null, back: null, purpose: '', category: '', sending: false };
let detail = { id: null, purpose: '', category: '', original: null };

// ---------- 通信 ----------
async function api(payload) {
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(Object.assign({ token: TOKEN }, payload)) // payload.tokenがあればそちらを使う(送信待ちは保存時のtokenで送る)
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error || '通信エラー');
  return json;
}

function setStatus(el, text, kind) { el.textContent = text; el.className = 'status ' + (kind || ''); }

// ---------- 端末内の送信待ち(IndexedDB。使えない環境ではこのページを開いている間だけ保持) ----------
let db = null;
let memQueue = [];

function openDb() {
  return new Promise((resolve) => {
    try {
      const r = indexedDB.open('pnsbc-meishi', 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('queue')) d.createObjectStore('queue', { keyPath: 'id' });
        if (!d.objectStoreNames.contains('thumbs')) d.createObjectStore('thumbs', { keyPath: 'id' });
      };
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
function qAll() {
  if (!db) return Promise.resolve(memQueue.slice());
  return new Promise((resolve, reject) => {
    const rq = db.transaction('queue', 'readonly').objectStore('queue').getAll();
    rq.onsuccess = () => resolve(rq.result);
    rq.onerror = () => reject(rq.error);
  });
}
function qPut(item) {
  if (!db) { memQueue.push(item); return Promise.resolve(); }
  return new Promise((resolve, reject) => {
    const tx = db.transaction('queue', 'readwrite');
    tx.objectStore('queue').put(item);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error || new Error('端末に保存できませんでした(空き容量を確認してください)'));
  });
}
function qDel(id) {
  if (!db) { memQueue = memQueue.filter((x) => x.id !== id); return Promise.resolve(); }
  return new Promise((resolve, reject) => {
    const tx = db.transaction('queue', 'readwrite');
    tx.objectStore('queue').delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// 一覧のサムネは一度取れば端末に覚えておく(サムネは作り直さないので古くならない)
function tGetMany(ids) {
  if (!db || !ids.length) return Promise.resolve({});
  return new Promise((resolve) => {
    const out = {};
    try {
      const tx = db.transaction('thumbs', 'readonly');
      const st = tx.objectStore('thumbs');
      ids.forEach((id) => { const rq = st.get(id); rq.onsuccess = () => { if (rq.result) out[id] = rq.result.uri; }; });
      tx.oncomplete = () => resolve(out);
      tx.onerror = () => resolve(out);
      tx.onabort = () => resolve(out);
    } catch (e) { resolve(out); }
  });
}
function tPut(id, uri) {
  if (!db) return;
  try { db.transaction('thumbs', 'readwrite').objectStore('thumbs').put({ id: id, uri: uri }); } catch (e) { /* 覚えられなくても動作には影響しない */ }
}

function nowStamp() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}

async function reloadPending() {
  const all = await qAll();
  pendingItems = all.filter((x) => x.token === TOKEN).sort((a, b) => (a.capturedAt < b.capturedAt ? -1 : 1));
  refreshSendBar();
  renderList();
}

// 未送信がある間は⚠️を出し続ける。ボタン自体は常時表示で、未送信が無い時/送信中は押せない状態にする
function refreshSendBar() {
  const n = pendingItems.length;
  $('send-count').textContent = n ? ' ' + n + '件' : '';
  $('send-badge').classList.toggle('show', n > 0);
  $('btn-send').disabled = n === 0 || batchSending;
}

$('btn-send').onclick = async () => {
  if (!pendingItems.length || batchSending) return;
  batchSending = true; refreshSendBar(); refreshShootButton();
  window.onbeforeunload = () => '送信中です。閉じると未送信が残ります';
  const targets = pendingItems.slice();
  let ok = 0, failed = 0, firstError = '';
  for (let i = 0; i < targets.length; i++) {
    setStatus($('send-status'), targets.length + '件中 ' + (i + 1) + '件目を送信中…(画面を閉じないでください)', 'busy');
    const it = targets[i];
    try {
      await api({ action: 'create', token: it.token, id: it.id, capturedAt: it.capturedAt, front: it.front, back: it.back, thumb: it.thumb || '', memo: it.memo });
      await qDel(it.id);
      ok++;
    } catch (e) {
      failed++;
      if (!firstError) firstError = String(e.message || e);
      if (e instanceof TypeError) break; // 通信そのものが切れている時は、残りも送れないのでここで止める
    }
  }
  window.onbeforeunload = null;
  batchSending = false;
  await reloadPending();
  refreshShootButton();
  if (failed) setStatus($('send-status'), ok + '件送信、残り ' + pendingItems.length + '件が未送信です(' + firstError + ')。もう一度「まとめて送信」を押してください', 'err');
  else setStatus($('send-status'), ok + '件を送信しました', 'ok');
  loadInfo();
};

// ---------- 画像処理(向きを正しくして縮小しJPEG化) ----------
// 名刺は横向きが大半なので、縦長に撮れた写真は自動で90°回して横向きにする(縦向きの名刺は回転ボタンで直す)
async function fileToCanvas(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const scale = Math.min(1, MAX_EDGE / Math.max(bmp.width, bmp.height));
  let canvas = document.createElement('canvas');
  canvas.width = Math.round(bmp.width * scale);
  canvas.height = Math.round(bmp.height * scale);
  canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
  if (canvas.height > canvas.width) canvas = rotateCanvas(canvas, 1);
  return canvas;
}

// dir: 1=右(時計回り)90°、-1=左90°
function rotateCanvas(src, dir) {
  const out = document.createElement('canvas');
  out.width = src.height;
  out.height = src.width;
  const ctx = out.getContext('2d');
  if (dir > 0) { ctx.translate(out.width, 0); ctx.rotate(Math.PI / 2); }
  else { ctx.translate(0, out.height); ctx.rotate(-Math.PI / 2); }
  ctx.drawImage(src, 0, 0);
  return out;
}

async function canvasToJpeg(canvas) {
  const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', JPEG_QUALITY));
  const dataUri = await new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(blob);
  });
  return { base64: dataUri.split(',')[1], preview: dataUri, canvas: canvas };
}

// 一覧用の小さい画像(表面。長辺300px以内)
function makeThumbBase64(canvas) {
  const c = document.createElement('canvas');
  const s = Math.min(1, 300 / canvas.width, 200 / canvas.height);
  c.width = Math.max(1, Math.round(canvas.width * s));
  c.height = Math.max(1, Math.round(canvas.height * s));
  c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.72).split(',')[1];
}

// ---------- 共通UI ----------
function buildChips(container, current, onPick, options) {
  container.innerHTML = '';
  (options || PURPOSES).forEach((p) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (p === current ? ' on' : '');
    b.textContent = p;
    b.onclick = () => onPick(p === current ? '' : p); // もう一度押すと解除
    container.appendChild(b);
  });
}

function fillAddressFromGps(inputEl, statusEl, btn) {
  if (!navigator.geolocation) { setStatus(statusEl, 'この端末では現在地を取得できません', 'err'); return; }
  btn.disabled = true;
  setStatus(statusEl, '現在地を取得中…', 'busy');
  navigator.geolocation.getCurrentPosition(async (pos) => {
    try {
      const r = await api({ action: 'geocode', lat: pos.coords.latitude, lng: pos.coords.longitude });
      if (r.address) { inputEl.value = r.address; inputEl.dispatchEvent(new Event('input')); setStatus(statusEl, '現在地を入れました(修正できます)', 'ok'); }
      else setStatus(statusEl, '住所を取得できませんでした。手入力してください', 'err');
    } catch (e) { setStatus(statusEl, String(e.message || e), 'err'); }
    btn.disabled = false;
  }, () => { setStatus(statusEl, '現在地の許可がありません。手入力してください', 'err'); btn.disabled = false; },
  { enableHighAccuracy: false, timeout: 10000 });
}

// ---------- 撮影タブ ----------
function refreshShootButton() {
  $('btn-save').disabled = !(shoot.front && $('received').value && !shoot.sending && !batchSending && staffName);
  $('btn-save').textContent = shoot.sending ? '保存中…' : '保存する';
  refreshRotateButtons();
}

function showShot(which) {
  $('img-' + which).src = shoot[which].preview;
  $('box-' + which).classList.add('filled');
}

function refreshRotateButtons() {
  ['front', 'back'].forEach((w) => {
    const off = !shoot[w] || shoot.sending;
    $('rot-l-' + w).disabled = off;
    $('rot-r-' + w).disabled = off;
  });
}

async function pickImage(which, file) {
  if (!file) return;
  try {
    shoot[which] = await canvasToJpeg(await fileToCanvas(file));
    showShot(which);
  } catch (e) { setStatus($('shoot-status'), '画像を読み込めませんでした: ' + e.message, 'err'); }
  refreshShootButton();
}

// 保存前の回転。回した結果をそのまま保存する(Driveに入る画像自体が回った状態になる)
async function rotateShot(which, dir) {
  if (!shoot[which]) return;
  try {
    shoot[which] = await canvasToJpeg(rotateCanvas(shoot[which].canvas, dir));
    showShot(which);
  } catch (e) { setStatus($('shoot-status'), '回転できませんでした: ' + e.message, 'err'); }
}
['front', 'back'].forEach((w) => {
  $('rot-l-' + w).onclick = () => rotateShot(w, -1);
  $('rot-r-' + w).onclick = () => rotateShot(w, 1);
});
$('in-front').onchange = (e) => { pickImage('front', e.target.files[0]); e.target.value = ''; };
$('in-back').onchange = (e) => { pickImage('back', e.target.files[0]); e.target.value = ''; };

$('no-back').onchange = () => {
  const on = $('no-back').checked;
  $('box-back').classList.toggle('disabled', on);
  if (on) { shoot.back = null; $('box-back').classList.remove('filled'); $('img-back').removeAttribute('src'); }
  refreshRotateButtons();
};

function renderShootChips() {
  buildChips($('purpose-chips'), shoot.purpose, (p) => { shoot.purpose = p; renderShootChips(); });
  buildChips($('category-chips'), shoot.category, (p) => { shoot.category = p; renderShootChips(); }, CATEGORIES);
}
$('received').oninput = refreshShootButton;
$('btn-geo').onclick = () => fillAddressFromGps($('place'), $('shoot-status'), $('btn-geo'));

function resetShootForm() {
  shoot = { front: null, back: null, purpose: '', category: '', sending: false };
  ['front', 'back'].forEach((w) => { $('box-' + w).classList.remove('filled'); $('img-' + w).removeAttribute('src'); });
  $('no-back').checked = false; $('box-back').classList.remove('disabled');
  $('place').value = ''; $('note').value = ''; $('received').value = todayStr();
  renderShootChips(); refreshShootButton();
}

$('btn-save').onclick = async () => {
  shoot.sending = true; refreshShootButton();
  setStatus($('shoot-status'), '保存中…', 'busy');
  try {
    const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2)).replace(/-/g, '').slice(0, 24);
    await qPut({
      id, token: TOKEN, staff: staffName, capturedAt: nowStamp(),
      front: shoot.front.base64,
      back: shoot.back ? shoot.back.base64 : null,
      thumb: makeThumbBase64(shoot.front.canvas),
      memo: { receivedDate: $('received').value, purpose: shoot.purpose, category: shoot.category, place: $('place').value, note: $('note').value }
    });
    await reloadPending();
    resetShootForm();
    setStatus($('shoot-status'), '端末に保存しました(未送信 ' + pendingItems.length + '件)。次の名刺を撮影できます', 'ok');
  } catch (e) {
    shoot.sending = false; refreshShootButton();
    setStatus($('shoot-status'), '保存できませんでした(入力内容は残してあります): ' + (e.message || e), 'err');
  }
};

// ---------- 一覧タブ ----------
function fmtDate(s) { return (s || '').slice(0, 16).replace(/-/g, '/'); }

function renderFilters() {
  const defs = [['all', 'すべて'], ['nomemo', 'メモ未記入'], ['client', '顧問先'], ['mine', '自分の登録']];
  $('filters').innerHTML = '';
  defs.forEach(([k, label]) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (filterMode === k ? ' on' : ''); b.textContent = label;
    b.onclick = () => { filterMode = k; renderFilters(); renderList(); };
    $('filters').appendChild(b);
  });
}

// 並び替え(2026-10-22)。空欄の名刺は、昇順・降順どちらでも最後に回す。送信待ち(未送信)は常に先頭
const SORTS = [['reg', '登録日時'], ['rcv', '受領日'], ['company', '会社名'], ['person', '氏名'], ['industry', '業種'], ['category', '区分']];
let sortKey = 'reg';
let sortDesc = true;
try {
  const s = JSON.parse(localStorage.getItem('pnsbc-sort') || 'null');
  if (s && SORTS.some((x) => x[0] === s.key)) { sortKey = s.key; sortDesc = !!s.desc; }
} catch (e) { /* 覚えていなければ既定(登録日時の新しい順) */ }

function sortValue(c, key) {
  const ex = c.ex || {};
  if (key === 'reg') return c.registeredAt || '';
  if (key === 'rcv') return c.receivedDate || '';
  if (key === 'company') return ex.company || c.name || '';
  if (key === 'person') return ex.person || '';
  if (key === 'industry') return ex.industry || '';
  if (key === 'category') return c.category || '';
  return '';
}
function sortCards(list) {
  return list.slice().sort((a, b) => {
    const x = sortValue(a, sortKey), y = sortValue(b, sortKey);
    if (!x && !y) return 0;
    if (!x) return 1;
    if (!y) return -1;
    const r = x.localeCompare(y, 'ja');
    return sortDesc ? -r : r;
  });
}
function renderSortBar() {
  const sel = $('sort-key');
  sel.innerHTML = '';
  SORTS.forEach(([k, label]) => {
    const o = document.createElement('option');
    o.value = k; o.textContent = label; o.selected = k === sortKey;
    sel.appendChild(o);
  });
  $('sort-dir').textContent = sortDesc ? '↓ 降順' : '↑ 昇順';
}
function saveSort() { try { localStorage.setItem('pnsbc-sort', JSON.stringify({ key: sortKey, desc: sortDesc })); } catch (e) { /* 覚えられなくても動作には影響しない */ } }
$('sort-key').onchange = () => { sortKey = $('sort-key').value; saveSort(); renderList(); };
$('sort-dir').onclick = () => { sortDesc = !sortDesc; saveSort(); renderSortBar(); renderList(); };

// ---------- 一覧のサムネ(見えているカードの分だけ、まとめて取りに行く) ----------
const thumbCache = new Map();
let thumbQueue = new Set();
let thumbTimer = null;
let thumbBusy = false;

function paintThumb(id) {
  const uri = thumbCache.get(id);
  if (!uri) return;
  document.querySelectorAll('img.thumb[data-id="' + id + '"]').forEach((im) => {
    im.src = uri; im.classList.add('on'); im.parentNode.classList.add('has');
  });
}
const thumbAsked = new Set();
function wantThumb(id) {
  if (thumbCache.has(id)) { paintThumb(id); return; }
  if (thumbAsked.has(id)) return;
  thumbAsked.add(id);
  thumbQueue.add(id);
  clearTimeout(thumbTimer);
  thumbTimer = setTimeout(flushThumbs, 120);
}
async function flushThumbs() {
  if (thumbBusy) { thumbTimer = setTimeout(flushThumbs, 300); return; }
  thumbBusy = true;
  try {
    let ids = Array.from(thumbQueue);
    thumbQueue = new Set();
    const stored = await tGetMany(ids);
    ids = ids.filter((id) => {
      if (stored[id]) { thumbCache.set(id, stored[id]); paintThumb(id); return false; }
      return true;
    });
    for (let i = 0; i < ids.length; i += 10) {
      const r = await api({ action: 'thumbs', ids: ids.slice(i, i + 10) });
      Object.keys(r.thumbs || {}).forEach((id) => { thumbCache.set(id, r.thumbs[id]); tPut(id, r.thumbs[id]); paintThumb(id); });
    }
  } catch (e) { /* サムネが取れなくても一覧は使える */ }
  thumbAsked.forEach((id) => { if (!thumbCache.has(id)) thumbAsked.delete(id); });
  thumbBusy = false;
}
// 見えているカード(画面の上下300px以内)のサムネだけを頼む。スクロール・タブ切替・一覧の描き直しの度に呼ぶ
function loadVisibleThumbs() {
  if (!$('view-list').classList.contains('active') || $('list-pane').style.display === 'none') return;
  document.querySelectorAll('.thumbbox[data-id]:not(.has)').forEach((box) => {
    const r = box.getBoundingClientRect();
    if (r.bottom > -300 && r.top < window.innerHeight + 300) wantThumb(box.dataset.id);
  });
}
let thumbScrollTimer = null;
window.addEventListener('scroll', () => { clearTimeout(thumbScrollTimer); thumbScrollTimer = setTimeout(loadVisibleThumbs, 150); }, { passive: true });

function renderList() {
  const pendingCards = pendingItems.map((p) => ({
    id: p.id, pending: true, receivedDate: p.memo.receivedDate, registeredAt: p.capturedAt, registeredBy: staffName,
    memoStatus: (p.memo.purpose || p.memo.place || p.memo.note) ? '済' : '未', category: p.memo.category, purpose: p.memo.purpose, place: p.memo.place, note: p.memo.note,
    thumbUri: p.thumb ? 'data:image/jpeg;base64,' + p.thumb : ''
  })).reverse();
  const keep = (c) => filterMode === 'all' || (filterMode === 'nomemo' && c.memoStatus !== '済') || (filterMode === 'client' && c.category === '顧問先') || (filterMode === 'mine' && c.registeredBy === staffName);
  const items = pendingCards.filter(keep).concat(sortCards(cards.filter(keep)));
  const box = $('list');
  box.innerHTML = '';
  if (!items.length) { box.innerHTML = '<div class="empty">該当する名刺はありません</div>'; return; }
  items.forEach((c) => {
    const ex = c.ex || {};
    const div = document.createElement('div');
    div.className = 'card';
    const head = [c.category, c.purpose, c.place].filter(Boolean).join(' / ');
    div.innerHTML = '<div class="thumbbox"><span class="ph">表</span><img class="thumb" alt=""></div><div class="cbody"><div class="top"><span></span><span></span></div><div class="main"></div></div>';
    const body = div.querySelector('.cbody');
    div.querySelector('.top span:first-child').textContent = c.receivedDate ? '受領 ' + c.receivedDate.replace(/-/g, '/') : fmtDate(c.registeredAt);
    div.querySelector('.top span:last-child').textContent = '登録: ' + c.registeredBy;
    const main = div.querySelector('.main');
    main.textContent = c.name || head || (c.note ? c.note.slice(0, 40) : '(メモなし)');
    if (c.pending) { const ub = document.createElement('span'); ub.className = 'badge unsent'; ub.textContent = '未送信'; main.appendChild(ub); }
    if (c.memoStatus !== '済') { const bd = document.createElement('span'); bd.className = 'badge'; bd.textContent = 'メモ未記入'; main.appendChild(bd); }
    const addLine = (text) => { if (!text) return; const sb = document.createElement('div'); sb.className = 'subline'; sb.textContent = text; body.appendChild(sb); };
    addLine([ex.title, ex.department].filter(Boolean).join(' ・ '));
    addLine(ex.tel1 ? '☎ ' + ex.tel1 : '');
    if (c.name && head) addLine(head);
    // サムネ: 未送信は端末内の画像をそのまま、送信済みは見えた時に取りに行く
    const im = div.querySelector('img.thumb');
    im.dataset.id = c.id;
    if (c.pending) { if (c.thumbUri) { im.src = c.thumbUri; im.classList.add('on'); im.parentNode.classList.add('has'); } }
    else if (c.hasThumb) {
      if (thumbCache.has(c.id)) paintThumb2(im, thumbCache.get(c.id));
      else im.parentNode.dataset.id = c.id; // 見える範囲に入ったらloadVisibleThumbsが取りに行く
    }
    if (!c.pending) div.onclick = () => openDetail(c.id); // 未送信分は送信後に開ける
    box.appendChild(div);
  });
  setTimeout(loadVisibleThumbs, 0);
}
function paintThumb2(im, uri) { im.src = uri; im.classList.add('on'); im.parentNode.classList.add('has'); }

// 名刺から読み取った項目(GAS側のEX_FIELDSと同じキー・順序)。上=よく使う連絡先、下=その他
const EX_TOP = [
  ['company', '会社名'], ['department', '部署'], ['title', '役職'], ['person', '氏名'], ['kana', 'ふりがな'],
  ['tel1', '電話1', 'tel'], ['tel2', '電話2', 'tel'], ['fax', 'FAX'], ['email', 'メール', 'mail'],
  ['url', 'URL', 'url'], ['postal', '郵便番号'], ['address', '住所', 'map']
];
const EX_BOTTOM = [['other', 'その他の印字', 'area'], ['industry', '業種(推定)'], ['backside', '裏面'], ['confidence', '確度'], ['issues', '要確認', 'area']];
const EX_ALL = EX_TOP.concat(EX_BOTTOM);
const ACT_LABEL = { tel: '発信', mail: 'メール', url: '開く', map: '地図' };

function actionHref(kind, v) {
  v = (v || '').trim();
  if (!v) return '';
  if (kind === 'tel') { const d = v.replace(/[^0-9+]/g, ''); return d ? 'tel:' + d : ''; }
  if (kind === 'mail') return 'mailto:' + v;
  if (kind === 'url') return /^https?:/i.test(v) ? v : 'http://' + v;
  if (kind === 'map') return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(v);
  return '';
}
function refreshExAction(key) {
  const def = EX_ALL.find((d) => d[0] === key);
  const a = $('dxa-' + key);
  if (!def || !a) return;
  const href = actionHref(def[2], $('dx-' + key).value);
  if (href) { a.href = href; a.classList.remove('disabled'); if (def[2] === 'url' || def[2] === 'map') { a.target = '_blank'; a.rel = 'noopener'; } }
  else { a.removeAttribute('href'); a.classList.add('disabled'); }
}
function buildExFields() {
  [['d-ex-top', EX_TOP], ['d-ex-bottom', EX_BOTTOM]].forEach(([cid, defs]) => {
    const box = $(cid);
    box.innerHTML = '';
    defs.forEach(([key, label, kind]) => {
      const row = document.createElement('div');
      row.className = 'exrow';
      const lb = document.createElement('label');
      lb.textContent = label; lb.htmlFor = 'dx-' + key;
      const inp = kind === 'area' ? document.createElement('textarea') : document.createElement('input');
      if (kind !== 'area') inp.type = 'text';
      inp.id = 'dx-' + key;
      inp.oninput = () => { refreshExAction(key); refreshDetailSave(); };
      row.appendChild(lb); row.appendChild(inp);
      if (ACT_LABEL[kind]) {
        const a = document.createElement('a');
        a.className = 'act disabled'; a.id = 'dxa-' + key; a.textContent = ACT_LABEL[kind];
        row.appendChild(a);
      }
      box.appendChild(row);
    });
  });
}
function readEx() {
  const o = {};
  EX_ALL.forEach((d) => { o[d[0]] = $('dx-' + d[0]).value; });
  return o;
}
function setEx(ex) {
  ex = ex || {};
  EX_ALL.forEach((d) => { $('dx-' + d[0]).value = ex[d[0]] || ''; refreshExAction(d[0]); });
}

async function openDetail(id) {
  $('list-pane').style.display = 'none'; $('detail-pane').style.display = 'block';
  window.scrollTo(0, 0);
  detail = { id, purpose: '', category: '', original: null };
  ['d-front', 'd-back'].forEach((k) => { $(k).textContent = '読み込み中…'; });
  $('d-meta').textContent = ''; $('d-name').value = ''; $('d-received').value = ''; $('d-place').value = ''; $('d-note').value = '';
  setEx({});
  $('btn-d-save').disabled = true; setStatus($('detail-status'), '', '');
  renderDetailChips();
  try {
    const { card } = await api({ action: 'get', id });
    setEx(card.ex);
    detail.original = { name: card.name, receivedDate: card.receivedDate, purpose: card.purpose, category: card.category, place: card.place, note: card.note, ex: readEx() };
    $('d-received').value = card.receivedDate; $('d-name').value = card.name;
    detail.purpose = card.purpose; detail.category = card.category;
    $('d-place').value = card.place; $('d-note').value = card.note;
    $('d-meta').textContent = '登録: ' + card.registeredBy + '(' + fmtDate(card.registeredAt) + ')  最終更新: ' + card.lastUpdatedBy + '(' + fmtDate(card.lastUpdatedAt) + ')';
    showImg('d-front', card.frontImage, '表'); showImg('d-back', card.backImage, '裏なし');
    renderDetailChips(); refreshDetailSave();
  } catch (e) { setStatus($('detail-status'), String(e.message || e), 'err'); }
}

function showImg(id, src, emptyText) {
  const el = $(id); el.textContent = '';
  if (!src) { el.textContent = emptyText; return; }
  const img = document.createElement('img'); img.src = src; el.appendChild(img);
}

function renderDetailChips() {
  buildChips($('d-purpose-chips'), detail.purpose, (p) => { detail.purpose = p; renderDetailChips(); refreshDetailSave(); });
  buildChips($('d-category-chips'), detail.category, (p) => { detail.category = p; renderDetailChips(); refreshDetailSave(); }, CATEGORIES);
}
function refreshDetailSave() {
  const o = detail.original;
  const dateOk = $('d-received').value !== '' || !o || o.receivedDate === ''; // 入っている受領日は空にできない
  const same = !!o && o.name === $('d-name').value && o.receivedDate === $('d-received').value && o.purpose === detail.purpose && o.category === detail.category && o.place === $('d-place').value && o.note === $('d-note').value && JSON.stringify(o.ex) === JSON.stringify(readEx());
  $('btn-d-save').disabled = !o || !dateOk || same;
}
$('d-name').oninput = refreshDetailSave; $('d-received').oninput = refreshDetailSave; $('d-place').oninput = refreshDetailSave; $('d-note').oninput = refreshDetailSave;
$('btn-d-geo').onclick = () => fillAddressFromGps($('d-place'), $('detail-status'), $('btn-d-geo'));

$('btn-d-save').onclick = async () => {
  $('btn-d-save').disabled = true; setStatus($('detail-status'), '保存中…', 'busy');
  try {
    const memo = { name: $('d-name').value, receivedDate: $('d-received').value, purpose: detail.purpose, category: detail.category, place: $('d-place').value, note: $('d-note').value, ex: readEx() };
    await api({ action: 'updateMemo', id: detail.id, memo });
    detail.original = memo;
    setStatus($('detail-status'), '保存しました', 'ok');
    loadInfo();
  } catch (e) { setStatus($('detail-status'), '保存できませんでした: ' + (e.message || e), 'err'); }
  refreshDetailSave();
};
$('btn-back').onclick = () => { $('detail-pane').style.display = 'none'; $('list-pane').style.display = 'block'; setTimeout(loadVisibleThumbs, 50); };

// ---------- タブ・初期化 ----------
document.querySelectorAll('.tab').forEach((t) => {
  t.onclick = () => {
    document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x === t));
    document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === 'view-' + t.dataset.view));
    setTimeout(loadVisibleThumbs, 50);
  };
});

async function loadInfo() {
  try {
    const r = await api({ action: 'info' });
    staffName = r.staff; cards = r.cards;
    $('who').textContent = staffName + ' さんの名刺登録';
    renderList(); refreshShootButton();
  } catch (e) {
    $('who').textContent = '登録者を確認できません';
    if (!staffName) document.body.insertAdjacentHTML('beforeend', '<div class="gate">' + String(e.message || e).replace(/</g, '&lt;') + '</div>');
  }
}

if (!TOKEN) {
  $('who').textContent = '登録者を確認できません';
  document.body.insertAdjacentHTML('beforeend', '<div class="gate">専用URL(?token=…付き)から開いてください</div>');
} else if (GAS_URL.indexOf('ここに') === 0) {
  $('who').textContent = '設定が未完了です';
  document.body.insertAdjacentHTML('beforeend', '<div class="gate">HTML内の GAS_URL を、デプロイ後のウェブアプリURLに書き換えてください</div>');
} else {
  buildExFields(); renderSortBar();
  $('received').value = todayStr(); renderShootChips(); renderFilters(); refreshShootButton(); loadInfo();
  openDb().then((d) => {
    db = d;
    if (!db) setStatus($('send-status'), '⚠️この端末では一時保存が使えません。閉じる前に必ず「まとめて送信」を押してください', 'err');
    return reloadPending();
  });
}
